name: Qualio E2E
description: Run your repository's Playwright E2E tests with Qualio AI - results, failure artifacts and self-healing, with Qualio's fixes suggested on your pull requests. The first run sets up the first test suite.
author: Qualio AI
branding:
  icon: check-circle
  color: purple

inputs:
  command:
    description: What the job does. "test" (default) runs the tests. "comment" (the workflow's comment job, on issue_comment) only tells Qualio about a new pull request comment, then posts Qualio's answer.
    default: test
  reply-wait-minutes:
    description: With command comment, how long to wait for Qualio's answer (the Analyst's reply) before leaving it for the next job.
    default: '3'
  tests-source:
    description: Deprecated and ignored. The tests always live in the repository, in the folder qualio.yml's tests.path names.
    default: ''
  working-directory:
    description: Deprecated. The tests folder in this repository, when the config doesn't set tests.path (Qualio's tests.path wins). Empty uses the project's folder in Qualio (e2e by default).
    default: ''
  api-key:
    description: The Project API Key (store it as the QUALIO_API_KEY secret). Without it, results are not reported (and tests-source qualio can't download the tests).
    required: true
  api-url:
    description: The Qualio URL that results are reported to (the generated workflow sets it).
    required: true
  base-url:
    description: The URL of the environment under test. Empty uses the target URL in playwright.config.ts.
    default: ''
  config:
    description: How Qualio works on this project, as YAML (version 1; see Qualio's Getting Started, Configuration) - the overview documents, spec approval, self-healing sensitivity, mapping, roles, GitHub and Jira. Sent to Qualio on every job with a checkout; settings it sets are read-only in Qualio. On a pull request, stricter changes apply to its branch at once and looser ones when it merges. Empty leaves the settings to Qualio's webapp.
    default: ''
  config-file:
    description: A YAML file in the repository holding the same config (e.g. .qualio/config.yml), instead of the config input. Needs actions/checkout first.
    default: ''
  commit-sha:
    description: The commit the results belong to.
    default: ${{ github.event.pull_request.head.sha || github.sha }}
  setup-wait-minutes:
    description: The first run (no test suite yet) maps the application in this job and checks the generated tests here until they pass. How long it may take in all before the job gives up (a re-run continues where it stopped). Keep it a few minutes under the job's timeout-minutes, so the action stops cleanly instead of GitHub cancelling the job.
    default: '25'
  heal-wait-minutes:
    description: How long to wait for Qualio to heal failed tests before giving up on the re-run.
    default: '10'
  node-version:
    description: The Node.js version to run the tests with.
    default: '20'
  upload-report:
    description: Keep Playwright's HTML report as a workflow artifact ("true" or "false").
    default: 'true'
  report-retention-days:
    description: Days to keep the HTML report artifact.
    default: '14'
  github-token:
    description: The token that sends Qualio's pull request report, suggestions, statuses, labels and re-runs when the Qualio GitHub App can't (not installed, or without the permission), and pushes Qualio's own qualio/* branch for its pull request into yours. The workflow needs `permissions` contents, pull-requests, issues, statuses and actions write for them. Empty sends nothing.
    default: ${{ github.token }}

outputs:
  playwright-version:
    description: The @playwright/test version installed in the tests folder.
    value: ${{ steps.playwright.outputs.version }}
  qualio-run-url:
    description: The Qualio page of this run (of the re-run after a heal, when there was one). Empty when the results were not reported.
    value: ${{ steps.summary.outputs.run-url }}
  heal-status:
    description: How healing a failed run ended (patched, proposed, declined, not_healable, stopped, failed, timeout, none). Empty when the tests passed or weren't run.
    value: ${{ steps.heal.outputs.status }}
  config-scope:
    description: Where this job's config applied (project, branch, none). Empty without a config input.
    value: ${{ steps.config.outputs.scope }}
  setup-state:
    description: The first test suite's setup in this job (ready = the project already had one, completed = set up by this job). Empty when the setup didn't run (no api-key).
    value: ${{ steps.setup.outputs.state }}

runs:
  using: composite
  steps:
    # Fail early with a readable message. Only whether the key is set reaches this step, never the key.
    - name: Check the inputs
      id: check
      shell: bash
      env:
        TESTS_SOURCE: ${{ inputs.tests-source }}
        HAS_API_KEY: ${{ inputs.api-key != '' }}
        HAS_API_URL: ${{ inputs.api-url != '' }}
        EVENT_NAME: ${{ github.event_name }}
        EVENT_ACTION: ${{ github.event.action }}
        COMMAND: ${{ inputs.command }}
      run: |
        rm -f "$RUNNER_TEMP/qualio-playwright.log" "$RUNNER_TEMP/qualio-run.json" "$RUNNER_TEMP/qualio-manifest.json"
        if [ -n "$TESTS_SOURCE" ]; then
          echo "::notice title=Qualio::tests-source is no longer used: the tests live in your repository, in qualio.yml's tests.path. Remove the input."
        fi
        if [ "$COMMAND" = "comment" ] && { [ "$HAS_API_KEY" != "true" ] || [ "$HAS_API_URL" != "true" ]; }; then
          echo "::error title=Qualio::The comment job needs api-key and api-url. Add the QUALIO_API_KEY repository secret."
          exit 1
        fi
        if [ "$HAS_API_KEY" != "true" ] || [ "$HAS_API_URL" != "true" ]; then
          echo "::warning title=Qualio::api-key or api-url is empty: the tests run, but results are not reported to Qualio and failures are not self-healed. Add the QUALIO_API_KEY repository secret."
        fi
        # The comment job only relays a comment. A closed pull request has nothing to test, and neither has
        # Qualio's own pull request into a branch (qualio/*): they only tell Qualio about it.
        if [ "$COMMAND" = "comment" ]; then
          echo "closed=true" >> "$GITHUB_OUTPUT"
          echo "comment=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        case "${GITHUB_HEAD_REF:-}" in
          qualio/*) echo "closed=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
        esac
        if [ "$EVENT_NAME" = "pull_request" ] && [ "$EVENT_ACTION" = "closed" ]; then
          echo "closed=true" >> "$GITHUB_OUTPUT"
        else
          echo "closed=false" >> "$GITHUB_OUTPUT"
        fi

    # Qualio follows pull requests through this job (title, description, branch, head, merged); it
    # never reads the repository. Never fails the job.
    - name: Tell Qualio about the pull request
      if: (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && inputs.command != 'comment' && inputs.api-key != '' && inputs.api-url != ''
      continue-on-error: true
      shell: bash
      env:
        QUALIO_API_URL: ${{ inputs.api-url }}
        QUALIO_API_KEY: ${{ inputs.api-key }}
      run: node "$GITHUB_ACTION_PATH/scripts/qualio.mjs" sync

    # qualio.yml's config (and the overview documents it names) for Qualio, before the setup maps the app
    # with it. An invalid config fails the job: nothing changes in Qualio. Never on a closed pull request
    # or in the comment job (no checkout).
    - name: Sync the Qualio config
      id: config
      if: steps.check.outputs.closed != 'true' && inputs.api-key != '' && inputs.api-url != '' && (inputs.config != '' || inputs.config-file != '')
      shell: bash
      env:
        QUALIO_API_URL: ${{ inputs.api-url }}
        QUALIO_API_KEY: ${{ inputs.api-key }}
        QUALIO_COMMIT_SHA: ${{ inputs.commit-sha }}
        CONFIG: ${{ inputs.config }}
        CONFIG_FILE: ${{ inputs.config-file }}
      run: node "$GITHUB_ACTION_PATH/scripts/qualio.mjs" config "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"

    # The comment job: a reply to the Analyst or a /qualio command, relayed to Qualio (no checkout).
    - name: Tell Qualio about the comment
      if: steps.check.outputs.comment == 'true'
      shell: bash
      env:
        QUALIO_API_URL: ${{ inputs.api-url }}
        QUALIO_API_KEY: ${{ inputs.api-key }}
      run: node "$GITHUB_ACTION_PATH/scripts/qualio.mjs" comment

    # The report, statuses, labels, re-runs and Qualio's changes to the tests (suggestions, its pull
    # request into this branch) Qualio queued for GitHub, sent with this job's token.
    - name: Send Qualio's GitHub updates
      if: inputs.api-key != '' && inputs.api-url != '' && inputs.github-token != ''
      continue-on-error: true
      shell: bash
      env:
        QUALIO_API_URL: ${{ inputs.api-url }}
        QUALIO_API_KEY: ${{ inputs.api-key }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: node "$GITHUB_ACTION_PATH/scripts/qualio.mjs" outbox

    - uses: actions/setup-node@v4
      if: steps.check.outputs.closed != 'true'
      with:
        node-version: ${{ inputs.node-version }}

    # Until the project has a first test suite that passed in CI, this job sets it up: the app (started
    # by an earlier step of the job) is mapped here, Qualio generates the tests, and they are checked
    # here (in the tests folder of this checkout, never committed by the job) until they all pass. Qualio
    # then opens a pull request into this branch that adds them. Test account secrets come from the job's env.
    - name: Set up the first test suite
      id: setup
      if: steps.check.outputs.closed != 'true' && inputs.api-key != '' && inputs.api-url != ''
      shell: bash
      env:
        QUALIO_API_URL: ${{ inputs.api-url }}
        QUALIO_API_KEY: ${{ inputs.api-key }}
        QUALIO_BASE_URL: ${{ inputs.base-url }}
        QUALIO_COMMIT_SHA: ${{ inputs.commit-sha }}
        QUALIO_RUN_MANIFEST: ${{ runner.temp }}/qualio-manifest.json
        WAIT_MINUTES: ${{ inputs.setup-wait-minutes }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: node "$GITHUB_ACTION_PATH/scripts/qualio.mjs" setup "$RUNNER_TEMP/qualio-map" "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" "$WAIT_MINUTES" "$WORKING_DIRECTORY"

    # The tests folder (qualio.yml's tests.path): a snapshot goes to Qualio for its agents, and the changes
    # Qualio offers on this branch (verified fixes, new tests) are written on top, so they run here too.
    - name: Prepare the tests
      id: tests
      if: steps.check.outputs.closed != 'true'
      shell: bash
      env:
        QUALIO_API_URL: ${{ inputs.api-url }}
        QUALIO_API_KEY: ${{ inputs.api-key }}
        QUALIO_COMMIT_SHA: ${{ inputs.commit-sha }}
        QUALIO_RUN_MANIFEST: ${{ runner.temp }}/qualio-manifest.json
        SETUP_STATE: ${{ steps.setup.outputs.state }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: node "$GITHUB_ACTION_PATH/scripts/qualio.mjs" prepare "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" "$WORKING_DIRECTORY"

    - name: Install dependencies
      if: steps.tests.outputs.run == 'true'
      shell: bash
      working-directory: ${{ steps.tests.outputs.dir }}
      run: |
        if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi

    - name: Read the Playwright version
      id: playwright
      if: steps.tests.outputs.run == 'true'
      shell: bash
      working-directory: ${{ steps.tests.outputs.dir }}
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      id: browsers
      if: steps.tests.outputs.run == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

    - name: Install Chromium
      if: steps.tests.outputs.run == 'true'
      shell: bash
      working-directory: ${{ steps.tests.outputs.dir }}
      run: |
        if [ "${{ steps.browsers.outputs.cache-hit }}" = "true" ]; then
          npx playwright install-deps chromium
        else
          npx playwright install --with-deps chromium
        fi

    # Qualio's reporter (from this action, QUALIO_REPORTER) reads these. Test account secrets
    # (E2E_<ROLE>_USERNAME / _PASSWORD) come from the calling job's env.
    # The output is also kept in a log so the summary can link to the Qualio run.
    # (shell: bash runs with pipefail, so a failing test still fails the step.)
    # A failure doesn't stop the job here: the heal and re-run steps decide.
    - name: Run Playwright tests
      id: test
      if: steps.tests.outputs.run == 'true'
      continue-on-error: true
      shell: bash
      working-directory: ${{ steps.tests.outputs.dir }}
      run: npx playwright test 2>&1 | tee "$RUNNER_TEMP/qualio-playwright.log"
      env:
        QUALIO_API_URL: ${{ inputs.api-url }}
        QUALIO_API_KEY: ${{ inputs.api-key }}
        QUALIO_BASE_URL: ${{ inputs.base-url }}
        QUALIO_COMMIT_SHA: ${{ inputs.commit-sha }}
        QUALIO_RUN_FILE: ${{ runner.temp }}/qualio-run.json
        QUALIO_RUN_MANIFEST: ${{ runner.temp }}/qualio-manifest.json
        QUALIO_REPORTER: ${{ steps.tests.outputs.reporter }}

    - name: Wait for Qualio to heal the failures
      id: heal
      if: steps.test.outcome == 'failure'
      shell: bash
      env:
        QUALIO_API_URL: ${{ inputs.api-url }}
        QUALIO_API_KEY: ${{ inputs.api-key }}
        WAIT_MINUTES: ${{ inputs.heal-wait-minutes }}
      run: node "$GITHUB_ACTION_PATH/scripts/qualio.mjs" wait "$RUNNER_TEMP/qualio-run.json" "$WAIT_MINUTES"

    # The fix is written into this checkout only (never committed by the job): the re-run proves it,
    # and Qualio then suggests it on the pull request. Reported to Qualio as round 2.
    - name: Run the healed tests again
      id: rerun
      if: steps.heal.outputs.status == 'patched'
      shell: bash
      working-directory: ${{ steps.tests.outputs.dir }}
      run: |
        node "$GITHUB_ACTION_PATH/scripts/qualio.mjs" apply . "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" "$MODE"
        echo "::group::Re-run after Qualio's heal"
        npx playwright test 2>&1 | tee -a "$RUNNER_TEMP/qualio-playwright.log"
        echo "::endgroup::"
      env:
        MODE: ${{ steps.tests.outputs.mode }}
        QUALIO_API_URL: ${{ inputs.api-url }}
        QUALIO_API_KEY: ${{ inputs.api-key }}
        QUALIO_BASE_URL: ${{ inputs.base-url }}
        QUALIO_COMMIT_SHA: ${{ inputs.commit-sha }}
        QUALIO_RUN_ROUND: '2'
        QUALIO_RUN_MANIFEST: ${{ runner.temp }}/qualio-manifest.json
        QUALIO_REPORTER: ${{ steps.tests.outputs.reporter }}

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() && inputs.upload-report == 'true' && steps.tests.outputs.run == 'true' }}
      with:
        name: playwright-report
        path: ${{ steps.tests.outputs.dir }}/playwright-report
        retention-days: ${{ inputs.report-retention-days }}
        if-no-files-found: ignore

    - name: Summary
      id: summary
      if: ${{ !cancelled() && steps.check.outputs.closed != 'true' }}
      shell: bash
      env:
        FIRST: ${{ steps.test.outcome }}
        RERUN: ${{ steps.rerun.outcome }}
        HEAL: ${{ steps.heal.outputs.status }}
        COMMIT_SHA: ${{ inputs.commit-sha }}
        UPLOAD_REPORT: ${{ inputs.upload-report }}
        SETUP: ${{ steps.setup.outputs.state }}
      run: |
        # The setup step wrote its own summary.
        if [ "$SETUP" = "completed" ]; then
          echo "run-url=" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        log="$RUNNER_TEMP/qualio-playwright.log"
        run_url=""
        healing=""
        if [ -f "$log" ]; then
          run_url=$(sed -n 's/.*\[qualio\] Results reported: \(http[^[:space:]]*\).*/\1/p' "$log" | tail -n 1)
          if grep -q '\[qualio\] Self-healing requested' "$log"; then healing=true; fi
        fi
        echo "run-url=$run_url" >> "$GITHUB_OUTPUT"
        outcome="${RERUN:-$FIRST}"
        case "$outcome" in
          success) result="✅ Passed" ;;
          failure) result="❌ Failed" ;;
          skipped|"") result="⏭️ Not run" ;;
          *) result="$outcome" ;;
        esac
        if [ -n "$RERUN" ] && [ "$RERUN" != "skipped" ]; then result="$result (after Qualio healed the tests)"; fi
        {
          echo "### Qualio E2E"
          echo ""
          echo "| | |"
          echo "| --- | --- |"
          echo "| Result | $result |"
          echo "| Commit | \`$COMMIT_SHA\` |"
          if [ -n "$HEAL" ]; then echo "| Heal | $HEAL |"; fi
          if [ -n "$run_url" ]; then
            echo "| Qualio | [Open the run in Qualio]($run_url) |"
          elif [ "$outcome" != "skipped" ] && [ -n "$outcome" ]; then
            echo "| Qualio | Not reported (see the \`[qualio]\` lines in the test log) |"
          fi
          if [ "$UPLOAD_REPORT" = "true" ] && [ "$outcome" != "skipped" ] && [ -n "$outcome" ]; then
            echo "| HTML report | The \`playwright-report\` artifact of this workflow run |"
          fi
          if [ "$RERUN" = "success" ]; then
            echo ""
            echo "Qualio fixed the tests and they pass with the fix in this job. Commit its suggestion on the pull request (or merge its pull request into this branch) to keep the tests in step."
          elif [ -n "$healing" ] && [ -z "$HEAL" ]; then
            echo ""
            echo "Qualio is diagnosing the failures. Test drift is fixed and suggested on this pull request; real application bugs are reported, never healed."
          elif [ "$HEAL" = "not_healable" ]; then
            echo ""
            echo "Qualio did not change the tests: the failures look like bugs in the application. See the run in Qualio."
          elif [ "$HEAL" = "proposed" ]; then
            echo ""
            echo "The UI changed, and Qualio proposes a fix for the tests. In Qualio, accept the change (it is then suggested on this pull request) or mark it as a bug."
          elif [ "$HEAL" = "declined" ]; then
            echo ""
            echo "This UI change was marked as a bug in Qualio, so the tests were not changed. Fix the application."
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    # The job failed before any results reached Qualio (dependencies, the tests didn't start…): the
    # run shows as errored in Qualio at once. A setup has its own state, so it is left out.
    - name: Tell Qualio the job failed
      if: failure() && inputs.api-key != '' && inputs.api-url != '' && steps.check.outputs.closed != 'true' && steps.config.outcome != 'failure' && steps.setup.outcome != 'failure' && steps.summary.outputs.run-url == ''
      continue-on-error: true
      shell: bash
      env:
        QUALIO_API_URL: ${{ inputs.api-url }}
        QUALIO_API_KEY: ${{ inputs.api-key }}
        QUALIO_COMMIT_SHA: ${{ inputs.commit-sha }}
      run: node "$GITHUB_ACTION_PATH/scripts/qualio.mjs" errored failure

    # Again at the end: what Qualio queued during this job (heal reports, regressions) goes out now.
    - name: Send Qualio's GitHub updates (end of job)
      if: ${{ !cancelled() && inputs.api-key != '' && inputs.api-url != '' && inputs.github-token != '' }}
      continue-on-error: true
      shell: bash
      env:
        QUALIO_API_URL: ${{ inputs.api-url }}
        QUALIO_API_KEY: ${{ inputs.api-key }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        # The comment job waits for Qualio's answer, so it's posted now rather than by the next job.
        WAIT_MINUTES: ${{ steps.check.outputs.comment == 'true' && inputs.reply-wait-minutes || '0' }}
      run: node "$GITHUB_ACTION_PATH/scripts/qualio.mjs" outbox "$WAIT_MINUTES"

    # The job's result is the re-run's when there was one, else the first run's.
    - name: Result
      if: ${{ !cancelled() && steps.test.outcome == 'failure' }}
      shell: bash
      env:
        RERUN: ${{ steps.rerun.outcome }}
        HEAL: ${{ steps.heal.outputs.status }}
        RUN_URL: ${{ steps.summary.outputs.run-url }}
      run: |
        if [ "$RERUN" = "success" ]; then
          echo "The tests pass with Qualio's fix. Commit the suggestion so the tests stay in step."
        elif [ "$HEAL" = "proposed" ]; then
          echo "::error title=Qualio::Qualio proposes a fix: review it in Qualio${RUN_URL:+ ($RUN_URL)}. Accept the UI change (it is then suggested on this pull request) or mark it as a bug."
          exit 1
        else
          echo "::error title=Qualio::The E2E tests failed. See the job summary and the run in Qualio."
          exit 1
        fi
