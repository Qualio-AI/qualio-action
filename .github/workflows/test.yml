name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

  fixture:
    runs-on: ubuntu-latest
    # Test account secrets reach the tests through the job env, as in the generated workflow.
    env:
      E2E_ADMIN_USERNAME: admin@example.test
    steps:
      - uses: actions/checkout@v4
      - id: action
        uses: ./
        with:
          working-directory: test/fixture
          api-key: ''
          api-url: http://qualio.test
      - name: The action reports its outputs
        env:
          PLAYWRIGHT_VERSION: ${{ steps.action.outputs.playwright-version }}
        run: test "$PLAYWRIGHT_VERSION" = "$(node -p "require('./test/fixture/package.json').devDependencies['@playwright/test']")"

  # A wrong working-directory must fail the job with a readable error, before npm runs.
  missing-folder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: action
        uses: ./
        continue-on-error: true
        with:
          working-directory: does-not-exist
          api-key: ''
          api-url: http://qualio.test
      - name: The action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: test "$OUTCOME" = failure

  # tests-source: qualio against a stub Qualio API: the downloaded test fails on a renamed button,
  # the stub reports the heal as patched, and the re-run with the fixed test passes.
  qualio-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the stub Qualio API
        run: |
          node test/stub-qualio.mjs 4555 &
          for _ in $(seq 1 20); do nc -z localhost 4555 && break; sleep 0.5; done
      - id: action
        uses: ./
        with:
          tests-source: qualio
          api-key: qk_stub
          api-url: http://localhost:4555
          heal-wait-minutes: '1'
      - name: The tests passed after the heal, in the same job
        env:
          OUTCOME: ${{ steps.action.outcome }}
          HEAL: ${{ steps.action.outputs.heal-status }}
          RUN_URL: ${{ steps.action.outputs.qualio-run-url }}
        run: |
          test "$OUTCOME" = success
          test "$HEAL" = patched
          test "$RUN_URL" = http://stub.test/runs/run_2
          routes=$(curl -fs http://localhost:4555/__calls | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).map((c) => c.route).join(' ')")
          test "$routes" = "/v1/tests/bundle /v1/tests/heal/status /v1/tests/heal/status /v1/tests/bundle"
