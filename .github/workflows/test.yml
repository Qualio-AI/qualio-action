name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

  # The diff helpers, the tests folder's snapshot, the setup's config, and the outbox (report, suggestions,
  # the Qualio pull request) against the stub Qualio and GitHub.
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test test/*.test.mjs

  fixture:
    runs-on: ubuntu-latest
    # Test account secrets reach the tests through the job env, as in the generated workflow.
    env:
      E2E_ADMIN_USERNAME: admin@example.test
    steps:
      - uses: actions/checkout@v4
      - id: action
        uses: ./
        with:
          working-directory: test/fixture
          api-key: ''
          api-url: http://qualio.test
      - name: The action reports its outputs
        env:
          PLAYWRIGHT_VERSION: ${{ steps.action.outputs.playwright-version }}
        run: test "$PLAYWRIGHT_VERSION" = "$(node -p "require('./test/fixture/package.json').devDependencies['@playwright/test']")"

  # A wrong working-directory must fail the job with a readable error, before npm runs.
  missing-folder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: action
        uses: ./
        continue-on-error: true
        with:
          working-directory: does-not-exist
          api-key: ''
          api-url: http://qualio.test
      - name: The action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: test "$OUTCOME" = failure

  # Tests in the repository against a stub Qualio API: test/heal-fixture's test fails on a renamed
  # button, the stub reports the heal as patched, the action writes the fix on top of the checkout and
  # the re-run passes, in the same job.
  heal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the stub Qualio API
        run: |
          node test/stub-qualio.mjs 4555 &
          for _ in $(seq 1 20); do nc -z localhost 4555 && break; sleep 0.5; done
      - id: action
        uses: ./
        with:
          api-key: qk_stub
          api-url: http://localhost:4555
          heal-wait-minutes: '1'
      - name: The tests passed with the fix, in the same job
        env:
          OUTCOME: ${{ steps.action.outcome }}
          HEAL: ${{ steps.action.outputs.heal-status }}
          RUN_URL: ${{ steps.action.outputs.qualio-run-url }}
        run: |
          test "$OUTCOME" = success
          test "$HEAL" = patched
          test "$RUN_URL" = http://stub.test/runs/run_2
          grep -q "name: 'Log in'" test/heal-fixture/tests/login.spec.ts
          routes=$(curl -fs http://localhost:4555/__calls | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).map((c) => c.route).filter((r) => r.startsWith('/v1/tests/') || r === '/v1/map/start').join(' ')")
          test "$routes" = "/v1/map/start /v1/tests/prepare /v1/tests/snapshot /v1/tests/snapshot /v1/tests/heal/status /v1/tests/heal/status /v1/tests/changes"

  # A project with no map yet: the job maps the app with Qualio's mapper first (no tests are generated),
  # then runs the repository's tests as usual.
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the stub Qualio API (no map yet)
        run: |
          node test/stub-qualio.mjs 4555 map &
          for _ in $(seq 1 20); do nc -z localhost 4555 && break; sleep 0.5; done
      - id: action
        uses: ./
        env:
          QUALIO_POLL_MS: '500'
        with:
          api-key: qk_stub
          api-url: http://localhost:4555
          heal-wait-minutes: '1'
      - name: The app was mapped, then the tests ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
          MAP: ${{ steps.action.outputs.map-state }}
          HEAL: ${{ steps.action.outputs.heal-status }}
        run: |
          test "$OUTCOME" = success
          test "$MAP" = mapped
          test "$HEAL" = patched
          routes=$(curl -fs http://localhost:4555/__calls | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).map((c) => c.route).filter((r) => r.startsWith('/v1/map/') || r === '/v1/tests/prepare').join(' ')")
          test "$routes" = "/v1/map/start /v1/map/c1/mapped /v1/map/c1/status /v1/tests/prepare"

  # No tests yet (tests.path names a folder that doesn't exist, and Qualio has nothing to write): the
  # job passes with a notice and runs nothing.
  empty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the stub Qualio API (no tests yet)
        run: |
          node test/stub-qualio.mjs 4555 empty &
          for _ in $(seq 1 20); do nc -z localhost 4555 && break; sleep 0.5; done
      - id: action
        uses: ./
        with:
          api-key: qk_stub
          api-url: http://localhost:4555
      - name: Nothing ran, and the job passed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VERSION: ${{ steps.action.outputs.playwright-version }}
        run: |
          test "$OUTCOME" = success
          test -z "$VERSION"
          test ! -e e2e-none-yet

  # The comment job (command: comment) never installs or runs tests, nor tells Qualio a pull request
  # closed; outside an issue_comment event it relays nothing.
  comment-command:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the stub Qualio API
        run: |
          node test/stub-qualio.mjs 4555 &
          for _ in $(seq 1 20); do nc -z localhost 4555 && break; sleep 0.5; done
      - id: action
        uses: ./
        with:
          command: comment
          api-key: qk_stub
          api-url: http://localhost:4555
          reply-wait-minutes: '0'
      - name: Only the outbox was read
        env:
          PLAYWRIGHT_VERSION: ${{ steps.action.outputs.playwright-version }}
        run: |
          test -z "$PLAYWRIGHT_VERSION"
          routes=$(curl -fs http://localhost:4555/__calls | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).map((c) => c.route).filter((r) => !r.startsWith('/repos/')).join(' ')")
          test "$routes" = "/v1/pr/outbox /v1/pr/outbox"
