name: Qualio Basher (hosted)
description: Asks Qualio to test your pull request on its own browsers - against your preview deploy or the staging environment chosen in Qualio - and waits for the result. Use it when your project's tests are hosted by Qualio.
author: Qualio AI
branding:
  icon: check-circle
  color: purple

inputs:
  api-key:
    description: The project API key (Settings → API keys), stored as the QUALIO_API_KEY secret.
    required: true
  api-url:
    description: Qualio's address (the served workflow sets it).
    required: true
  url:
    description: The preview deploy's URL for this pull request (empty: the staging environment chosen in Qualio).
    default: ''
  bash-minutes:
    description: Deprecated and ignored. The pull request run no longer bashes; start an exploratory run or a bug bash from the app instead.
    default: '0'
  job-minutes:
    description: How long to wait for Qualio at most.
    default: '60'
  github-token:
    description: Posts Qualio's report and statuses on the pull request.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Qualio
      shell: bash
      env:
        QUALIO_API_KEY: ${{ inputs.api-key }}
        QUALIO_API_URL: ${{ inputs.api-url }}
        QUALIO_HOSTED_URL: ${{ inputs.url }}
        QUALIO_JOB_MINUTES: ${{ inputs.job-minutes }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      # The hosted action needs no dependencies: Node's fetch only.
      run: node "${{ github.action_path }}/../scripts/qualio.mjs" hosted
